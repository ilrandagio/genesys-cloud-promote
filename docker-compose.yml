services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gcp
      POSTGRES_PASSWORD: gcp
      POSTGRES_DB: gcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcp"]
      interval: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine

  api:
    restart: unless-stopped
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://gcp:gcp@postgres:5432/gcp
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${APP_URL:-http://localhost:8080}
      # Porta interna fissa: nginx inoltra ad api:3000 (API_PORT del .env vale solo per lo sviluppo in locale)
      API_PORT: "3000"
      BACKUP_DIR: /data/backups
    volumes:
      - backups:/data/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    restart: unless-stopped
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gcp:gcp@postgres:5432/gcp
      REDIS_URL: redis://redis:6379
      BACKUP_DIR: /data/backups
    volumes:
      - tfplugins:/var/cache/terraform-plugins
      - backups:/data/backups
    depends_on:
      - api

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  tfplugins:
  backups:
