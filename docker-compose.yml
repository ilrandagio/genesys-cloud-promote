services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gcp
      POSTGRES_PASSWORD: gcp
      POSTGRES_DB: gcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://gcp:gcp@postgres:5432/gcp
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${APP_URL:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gcp:gcp@postgres:5432/gcp
      REDIS_URL: redis://redis:6379
    volumes:
      - tfplugins:/var/cache/terraform-plugins
    depends_on:
      - api

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  tfplugins:
